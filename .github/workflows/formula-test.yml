name: Formula Test

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '27 8 * * 1'

jobs:
  formula-test:
    name: Brew audit install and test
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Runner platform
        run: uname -s

      - name: Verify tap redirect
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_REPO_ID: '1147062379'
        run: |
          actual_id="$(gh api repos/tokenuse/homebrew-tap --jq .id)"
          if [ "$actual_id" != "$EXPECTED_REPO_ID" ]; then
            echo "::error::tokenuse/homebrew-tap resolved to repo id ${actual_id}, expected ${EXPECTED_REPO_ID}"
            exit 1
          fi

      - name: Audit formula
        run: brew audit --strict --formula tokenuse

      - name: Install formula
        run: brew install --formula ./Formula/tokenuse.rb

      - name: Test formula
        run: brew test tokenuse
